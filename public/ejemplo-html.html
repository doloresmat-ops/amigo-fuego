<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo Favicon AF</title>
  
  <!-- Favicon principal (ICO para máxima compatibilidad) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- PNG tamaños comunes -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
  
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  
  <!-- Android / PWA -->
  <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
  
  <!-- Opcional: manifest para PWA -->
  <!-- <link rel="manifest" href="site.webmanifest"> -->
</head>
<body>
  <h1>Favicon configurado correctamente</h1>
  <p>Copia estos archivos a la raíz de tu sitio o a la carpeta pública y usa estas etiquetas en el <head>.</p>
</body>
</html>
